[package]
name = "deser-jsonc"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
description = "JSONC (JSON with comments) support for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "jsonc", "json", "config"]
categories = ["encoding", "parser-implementations", "config", "no-std"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-jsonc"

[features]
default = ["std", "io", "speedups"]
# the standard library, without it only `alloc` is needed
std = ["deser-core/std", "simdutf8?/std"]
# reading and writing values from and to streams (with `deser::io`)
io = ["std", "deser-core/io"]
# faster UTF-8 validation (simdutf8)
speedups = ["dep:simdutf8"]

[dependencies]
deser-core = { version = "0.10.0", path = "../deser-core", default-features = false }
itoa = "1.0.18"
zmij = "1.0.23"
simdutf8 = { version = "0.1.5", optional = true, default-features = false }

[dev-dependencies]
deser = { version = "0.10.0", path = "../deser", features = ["derive"] }
