[package]
name = "deser-json5"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
description = "JSON5 support for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "json5"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-json5"
# the vendored test suite is only needed for development
exclude = ["tests/data"]
autotests = false

[features]
default = ["io"]
# reading and writing values from and to streams (with `deser::io`)
io = ["deser-core/io", "deser-json/io"]
# faster UTF-8 validation (simdutf8) and faster serialization (see deser-json)
speedups = ["dep:simdutf8", "deser-json/speedups"]

[dependencies]
deser-core = { version = "0.8.0", path = "../deser-core", default-features = false }
# the serializer (JSON is valid JSON5)
deser-json = { version = "0.8.0", path = "../deser-json", default-features = false }
simdutf8 = { version = "0.1.5", optional = true }
# the characters of identifiers (map keys without quotes)
unicode-ident = "1.0.12"

[dev-dependencies]
deser = { version = "0.8.0", path = "../deser", features = ["derive"] }
deser-location = { version = "0.8.0", path = "../deser-location" }
deser-value = { version = "0.8.0", path = "../deser-value" }

[[test]]
name = "integration"
path = "tests/integration.rs"
