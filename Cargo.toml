[workspace]
members = [
  "deser",
  "deser-debug",
  "deser-derive",
  "deser-cbor",
  "deser-json",
  "deser-location",
  "deser-path",
  "deser-serde",
  "deser-yaml",
  "deser-toml",
  "deser-tokio",
  "examples/adapters",
  "examples/borrowing",
  "examples/bytes",
  "examples/config-errors",
  "examples/crate-path",
  "examples/debug",
  "examples/deep-nesting",
  "examples/enums",
  "examples/formats",
  "examples/json",
  "examples/json-lines",
  "examples/json-numbers",
  "examples/layers",
  "examples/located",
  "examples/manual-struct",
  "examples/optionals",
  "examples/streams",
  "examples/tokio-server",
]
resolver = "3"

[profile.dev]
# Incremental compilation leaves new object files in target/debug/deps on
# every build (with the unpacked debug info that is the default on macOS).
# They are never cleaned up and rustc lists that directory on every
# invocation which made builds and doctests slower and slower.  The crates
# are small, a non-incremental build is about as fast.
incremental = false

[workspace.package]
edition = "2024"
rust-version = "1.88"
