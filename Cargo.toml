[workspace]
members = [
  "deser",
  "deser-core",
  "deser-debug",
  "deser-derive",
  "deser-cbor",
  "deser-csv",
  "deser-msgpack",
  "deser-encoding",
  "deser-json",
  "deser-jsonc",
  "deser-json5",
  "deser-hj",
  "deser-ini",
  "deser-location",
  "deser-path",
  "deser-php",
  "deser-pickle",
  "deser-plist",
  "deser-template-json",
  "deser-serde",
  "deser-value",
  "deser-yaml",
  "deser-toml",
  "deser-transcode",
  "deser-urlencoded",
  "deser-xml",
  "deser-validate",
  "deser-env",
  "deser-tokio",
  "examples/adapters",
  "examples/borrowing",
  "examples/bytes",
  "examples/config",
  "examples/config-errors",
  "examples/crate-path",
  "examples/csv",
  "examples/debug",
  "examples/deep-nesting",
  "examples/dynamic-values",
  "examples/enums",
  "examples/env",
  "examples/formats",
  "examples/generic-types",
  "examples/ini",
  "examples/input-contracts",
  "examples/json",
  "examples/json-lines",
  "examples/json-numbers",
  "examples/layers",
  "examples/located",
  "examples/manual-struct",
  "examples/no-std",
  "examples/open-enums",
  "examples/open-enums/pipeline",
  "examples/open-enums/pipeline-extras",
  "examples/optionals",
  "examples/php",
  "examples/pickle",
  "examples/plist",
  "examples/protocol",
  "examples/query-strings",
  "examples/raw-values",
  "examples/renames",
  "examples/serde-types",
  "examples/streams",
  "examples/tokio-server",
  "examples/validation",
  "examples/xml-namespaces",
  "examples/xml-pretty",
]
resolver = "3"

[profile.dev]
# Incremental compilation leaves new object files in target/debug/deps on
# every build (with the unpacked debug info that is the default on macOS).
# They are never cleaned up and rustc lists that directory on every
# invocation which made builds and doctests slower and slower.  The crates
# are small, a non-incremental build is about as fast.
incremental = false

[workspace.package]
edition = "2024"
rust-version = "1.88"
