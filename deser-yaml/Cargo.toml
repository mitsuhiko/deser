[package]
name = "deser-yaml"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
description = "YAML support for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "yaml", "config"]
categories = ["encoding", "parser-implementations", "config"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-yaml"
# the vendored conformance test data is only needed for development
exclude = ["tests/data"]
autotests = false

[features]
default = ["io", "speedups"]
# reading and writing values from and to streams (with `deser::io`)
io = ["deser-core/io"]
# faster UTF-8 validation (simdutf8)
speedups = ["dep:simdutf8"]

[dependencies]
deser-core = { version = "0.9.1", path = "../deser-core", default-features = false }
simdutf8 = { version = "0.1.5", optional = true }
itoa = "1.0.18"
zmij = "1.0.23"

[dev-dependencies]
deser = { version = "0.9.1", path = "../deser", features = ["derive"] }
deser-encoding = { path = "../deser-encoding" }
deser-location = { version = "0.9.1", path = "../deser-location" }

[[test]]
name = "yaml_test_suite"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"
