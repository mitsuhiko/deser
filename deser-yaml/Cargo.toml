[package]
name = "deser-yaml"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
description = "YAML support for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "yaml"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-yaml"
# the vendored conformance test data is only needed for development
exclude = ["tests/data"]
autotests = false

[features]
default = ["io"]
# reading and writing values from and to streams (with `deser::io`)
io = ["deser/io"]
# faster float formatting (zmij) and UTF-8 validation (simdutf8)
speedups = ["dep:simdutf8", "dep:zmij"]

[dependencies]
deser = { version = "0.8.0", path = "../deser", default-features = false }
simdutf8 = { version = "0.1.5", optional = true }
zmij = { version = "1.0.23", optional = true }

[dev-dependencies]
deser = { version = "0.8.0", path = "../deser", features = ["derive"] }
deser-location = { version = "0.8.0", path = "../deser-location" }

[[test]]
name = "yaml_test_suite"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"
