[package]
name = "benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]

[features]
count-allocs = []

[dependencies]
deser = { path = "../deser", features = ["derive"] }
deser-cbor = { path = "../deser-cbor", features = ["speedups"] }
deser-json = { path = "../deser-json", features = ["speedups"] }
deser-toml = { path = "../deser-toml", features = ["speedups"] }
deser-value = { path = "../deser-value" }
deser-yaml = { path = "../deser-yaml", features = ["speedups"] }
# the serde libraries that are compared against
ciborium = "0.2.2"
serde = { version = "1.0.136", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.79"
toml = "1.1.6"
miniserde = "0.1.21"

[profile.bench]
debug = true
split-debuginfo = "packed"

[profile.release]
debug = true
split-debuginfo = "packed"
