[package]
name = "benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]

[features]
count-allocs = []

[dependencies]
deser = { path = "../deser", features = ["derive"] }
deser-cbor = { path = "../deser-cbor", features = ["speedups"] }
deser-csv = { path = "../deser-csv" }
deser-encoding = { path = "../deser-encoding" }
deser-json = { path = "../deser-json", features = ["speedups"] }
deser-msgpack = { path = "../deser-msgpack", features = ["speedups"] }
deser-toml = { path = "../deser-toml", features = ["speedups"] }
deser-value = { path = "../deser-value" }
deser-yaml = { path = "../deser-yaml", features = ["speedups"] }
# the serde libraries that are compared against
ciborium = "0.2.2"
csv = "1.3.1"
serde = { version = "1.0.136", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.79"
toml = "1.1.6"
miniserde = "0.1.21"
rmp-serde = "1.3.0"

# One codegen unit: this crate holds the derived code of both libraries,
# with more units a change to the derived code of one can move the code of
# the other into other units which changes what is inlined (serde_json
# serialized up to 25% slower after the derived code of deser changed).
[profile.bench]
debug = true
split-debuginfo = "packed"
codegen-units = 1

[profile.release]
debug = true
split-debuginfo = "packed"
codegen-units = 1
