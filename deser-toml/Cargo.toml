[package]
name = "deser-toml"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
description = "TOML support for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "toml", "config"]
categories = ["encoding", "parser-implementations", "config"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-toml"
# the vendored conformance test data is only needed for development
exclude = ["tests/data"]
autotests = false

[features]
default = ["io", "zmij"]
# reading and writing values from and to streams (with `deser::io`)
io = ["deser-core/io"]
# formats floats with zmij, which is faster and makes binaries smaller than
# the fallback (the text is the same)
zmij = ["dep:zmij"]
# faster UTF-8 validation (simdutf8), implies `zmij`
speedups = ["dep:simdutf8", "zmij"]

[dependencies]
deser-core = { version = "0.9.0", path = "../deser-core", default-features = false }
simdutf8 = { version = "0.1.5", optional = true }
zmij = { version = "1.0.23", optional = true }

[dev-dependencies]
deser = { version = "0.9.0", path = "../deser", features = ["derive", "jiff"] }
deser-encoding = { path = "../deser-encoding" }
deser-location = { version = "0.9.0", path = "../deser-location" }
jiff = "0.2.14"
deser-json = { version = "0.9.0", path = "../deser-json" }

[[test]]
name = "toml_test_suite"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"
