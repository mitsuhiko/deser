[package]
name = "deser-env"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.10.1"
edition.workspace = true
rust-version.workspace = true
description = "Environment variables for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "environment", "env", "config"]
categories = ["config", "encoding"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-env"
autotests = false

[features]
default = ["speedups"]
# no speedups yet, the feature exists so that all formats have it
speedups = []

[dependencies]
deser-core = { version = "0.10.1", path = "../deser-core", default-features = false }
zmij = "1.0.23"

[dev-dependencies]
deser = { version = "0.10.1", path = "../deser", features = ["derive"] }
deser-path = { version = "0.10.1", path = "../deser-path" }

[[test]]
name = "integration"
path = "tests/integration.rs"
