[package]
name = "deser-urlencoded"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
description = "Query strings and form data (application/x-www-form-urlencoded) for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "urlencoded", "querystring", "form"]
categories = ["encoding", "web-programming"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-urlencoded"
autotests = false

[features]
default = ["io", "speedups"]
# reading and writing values from and to streams (with `deser::io`)
io = ["deser-core/io"]
# formats floats with zmij, which is faster and makes binaries smaller than
# the fallback (the text is the same)
speedups = ["dep:zmij"]

[dependencies]
deser-core = { version = "0.9.1", path = "../deser-core", default-features = false }
zmij = { version = "1.0.23", optional = true }

[dev-dependencies]
# the float formatting is tested against it
zmij = "1.0.23"
deser = { version = "0.9.1", path = "../deser", features = ["derive"] }
deser-path = { version = "0.9.1", path = "../deser-path" }
deser-value = { version = "0.9.1", path = "../deser-value" }

[[test]]
name = "integration"
path = "tests/integration.rs"
