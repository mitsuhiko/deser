[package]
name = "deser-urlencoded"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
description = "Query strings and form data (application/x-www-form-urlencoded) for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "urlencoded", "querystring", "form"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-urlencoded"
autotests = false

[features]
default = ["io"]
# reading and writing values from and to streams (with `deser::io`)
io = ["deser/io"]

[dependencies]
deser = { version = "0.8.0", path = "../deser", default-features = false }

[dev-dependencies]
deser = { version = "0.8.0", path = "../deser", features = ["derive"] }
deser-path = { version = "0.8.0", path = "../deser-path" }
deser-value = { version = "0.8.0", path = "../deser-value" }

[[test]]
name = "integration"
path = "tests/integration.rs"
