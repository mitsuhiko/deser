name: Tests

on: [push]

jobs:
  test-latest:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Test
        run: make test

  test-msrv:
    name: Test (MSRV)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: Test
        run: make msrv

  miri-test-latest:
    name: Miri Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    # miri is slow, the crates are split across jobs so they run in parallel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deser
            crates: deser
          - name: deser, tree borrows
            tree-borrows-crates: deser
          - name: deser-json
            crates: deser-json
          - name: other crates
            crates: deser-cbor deser-path deser-location deser-debug

    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - name: Miri Test
        run: make miri-test MIRI_CRATES="${{ matrix.crates }}" MIRI_TREE_BORROWS_CRATES="${{ matrix.tree-borrows-crates }}"
