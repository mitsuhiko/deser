name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Build docs
        env:
          RUSTDOCFLAGS: --cfg docsrs
        run: cargo doc --no-deps --all-features -p 'deser*'
      - name: Point docs.rs links of deser crates to the dev docs
        run: |
          find target/doc -name '*.html' -print0 | xargs -0 perl -pi -e '
            s{href="https://docs\.rs/(deser(?:-[a-z0-9]+)*)(?:/latest/\w+)?(/[^"]*)?"}{
              my ($crate, $path) = ($1, $2);
              (my $module = $crate) =~ tr/-/_/;
              "href=\"/deser/$module" . ($path && $path ne "/" ? $path : "/index.html") . "\""
            }ge'
      - name: Add index redirect
        run: echo '<meta http-equiv="refresh" content="0; url=deser/index.html">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
