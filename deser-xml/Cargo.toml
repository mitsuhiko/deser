[package]
name = "deser-xml"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
description = "XML support for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "xml"]
categories = ["encoding", "parser-implementations"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-xml"
autotests = false

[features]
default = ["io", "speedups"]
# reading and writing documents from and to streams (with `deser::io`)
io = ["deser-core/io"]
# formats floats with zmij, which is faster and makes binaries smaller than
# the fallback (the text is the same)
speedups = ["dep:zmij"]

[dependencies]
deser-core = { version = "0.9.1", path = "../deser-core", default-features = false, features = ["std"] }
quick-xml = "0.42.0"
zmij = { version = "1.0.23", optional = true }

[dev-dependencies]
# the float formatting is tested against it
zmij = "1.0.23"
deser = { version = "0.9.1", path = "../deser", features = ["derive"] }
deser-encoding = { path = "../deser-encoding" }
deser-json = { version = "0.9.1", path = "../deser-json" }
deser-path = { version = "0.9.1", path = "../deser-path" }
deser-value = { version = "0.9.1", path = "../deser-value" }

[[test]]
name = "integration"
path = "tests/integration.rs"
