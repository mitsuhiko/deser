[package]
name = "deser-value"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
description = "A dynamic value type for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-value"
autotests = false

[dependencies]
deser = { version = "0.8.0", path = "../deser", default-features = false }
indexmap = { version = "2.9", default-features = false, features = ["std"] }

[dev-dependencies]
deser = { version = "0.8.0", path = "../deser", features = ["derive"] }
deser-cbor = { version = "0.8.0", path = "../deser-cbor" }
deser-json = { version = "0.8.0", path = "../deser-json" }
deser-location = { version = "0.8.0", path = "../deser-location" }
deser-path = { version = "0.8.0", path = "../deser-path" }
deser-toml = { version = "0.8.0", path = "../deser-toml" }
deser-yaml = { version = "0.8.0", path = "../deser-yaml" }

[[test]]
name = "integration"
path = "tests/integration.rs"
