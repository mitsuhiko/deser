[package]
name = "deser-template-json"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "The template and tests of the JSON dialect parsers (not published)"
license = "Apache-2.0"
publish = false
autotests = false

# never documented, see the README
[lib]
doc = false

[features]
default = ["std", "io", "speedups"]
std = ["deser-core/std", "simdutf8?/std"]
io = ["std", "deser-core/io"]
# faster UTF-8 validation (simdutf8)
speedups = ["dep:simdutf8"]

[dependencies]
deser-core = { path = "../deser-core", default-features = false }
# writing floats and integers
itoa = "1.0.18"
zmij = "1.0.23"
simdutf8 = { version = "0.1.5", optional = true, default-features = false }
# the characters of identifiers (map keys without quotes)
unicode-ident = "1.0.12"

[dev-dependencies]
# the tests compare the dialects with JSON
deser-json = { path = "../deser-json" }
deser = { path = "../deser", features = ["derive"] }
deser-encoding = { path = "../deser-encoding" }
deser-json5 = { path = "../deser-json5" }
deser-hj = { path = "../deser-hj" }
deser-jsonc = { path = "../deser-jsonc" }
deser-location = { path = "../deser-location" }

# the tests of reading JSON, JSONC, JSON5 and Hjson
[[test]]
name = "integration"
path = "tests/integration.rs"
