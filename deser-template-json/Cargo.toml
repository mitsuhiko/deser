[package]
name = "deser-template-json"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "The template and tests of the JSON dialect parsers (not published)"
license = "Apache-2.0"
publish = false
autotests = false

# never documented, see the README
[lib]
doc = false

[features]
default = ["std", "io"]
std = ["deser-core/std", "deser-json/std", "simdutf8?/std"]
io = ["std", "deser-core/io", "deser-json/io"]
speedups = ["dep:simdutf8", "deser-json/speedups"]

[dependencies]
deser-core = { version = "0.8.0", path = "../deser-core", default-features = false }
deser-json = { version = "0.8.0", path = "../deser-json", default-features = false }
simdutf8 = { version = "0.1.5", optional = true, default-features = false }
# the characters of identifiers (map keys without quotes)
unicode-ident = "1.0.12"

[dev-dependencies]
deser = { version = "0.8.0", path = "../deser", features = ["derive"] }
deser-encoding = { path = "../deser-encoding" }
deser-json5 = { version = "0.8.0", path = "../deser-json5" }
deser-hj = { version = "0.8.0", path = "../deser-hj" }
deser-jsonc = { version = "0.8.0", path = "../deser-jsonc" }
deser-location = { version = "0.8.0", path = "../deser-location" }

# the tests of reading JSON, JSONC, JSON5 and Hjson
[[test]]
name = "integration"
path = "tests/integration.rs"
