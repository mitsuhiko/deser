[package]
name = "deser-core"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
description = "The core of deser, use the deser crate instead"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization"]
license = "Apache-2.0"
documentation = "https://docs.rs/deser"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["io"]
# the support code of derived implementations (the derive macros are in
# deser-derive and re-exported by deser)
derive = []
# reading and writing values from and to streams (`deser::io`)
io = []

[dependencies]
# types of these crates serialize as well-known extension types
bigdecimal = { version = "0.4", optional = true, default-features = false, features = ["std"] }
chrono = { version = "0.4.38", optional = true, default-features = false }
jiff = { version = "0.2.14", optional = true, default-features = false, features = ["std"] }
num-bigint = { version = "0.4", optional = true, default-features = false, features = ["std"] }
rust_decimal = { version = "1.33", optional = true, default-features = false, features = ["std"] }
time = { version = "0.3.40", optional = true, default-features = false }
uuid = { version = "1", optional = true, default-features = false }

[dev-dependencies]
# the examples in the documentation use deser (with derive)
deser = { path = "../deser", features = ["derive"] }
time = { version = "0.3.40", default-features = false, features = ["macros"] }
# the float formatting of the formats without speedups is tested against it
zmij = "1.0.23"
