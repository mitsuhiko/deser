[package]
name = "deser-hjson"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
description = "Hjson support for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "hjson", "config"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-hjson"
# the vendored test suite is only needed for development
exclude = ["tests/data"]
autotests = false

[features]
default = ["std", "io"]
# the standard library, without it only `alloc` is needed
std = ["deser-core/std", "deser-json/std", "simdutf8?/std"]
# reading and writing values from and to streams (with `deser::io`)
io = ["std", "deser-core/io", "deser-json/io"]
# faster UTF-8 validation (simdutf8) and faster serialization (see deser-json)
speedups = ["dep:simdutf8", "deser-json/speedups"]

[dependencies]
deser-core = { version = "0.8.0", path = "../deser-core", default-features = false }
# the serializer (JSON is valid Hjson)
deser-json = { version = "0.8.0", path = "../deser-json", default-features = false }
simdutf8 = { version = "0.1.5", optional = true, default-features = false }

[dev-dependencies]
deser = { version = "0.8.0", path = "../deser", features = ["derive"] }
deser-value = { version = "0.8.0", path = "../deser-value" }

[[test]]
name = "integration"
path = "tests/integration.rs"
