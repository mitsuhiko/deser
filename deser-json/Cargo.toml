[package]
name = "deser-json"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
description = "JSON support for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "json"]
categories = ["encoding", "parser-implementations", "no-std"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-json"
autotests = false

[features]
default = ["std", "io"]
# the standard library, without it only `alloc` is needed
std = ["deser-core/std", "simdutf8?/std"]
# reading and writing values from and to streams (with `deser::io`)
io = ["std", "deser-core/io"]
# faster float formatting (zmij) and UTF-8 validation (simdutf8)
speedups = ["dep:simdutf8", "dep:zmij"]

[dependencies]
deser-core = { version = "0.9.0", path = "../deser-core", default-features = false }
simdutf8 = { version = "0.1.5", optional = true, default-features = false }
zmij = { version = "1.0.23", optional = true }

[dev-dependencies]
deser = { version = "0.9.0", path = "../deser", features = ["derive"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
