[package]
name = "deser"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
description = "An experimental serialization and deserialization library for Rust"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "serde", "derive", "no_std"]
categories = ["encoding", "no-std"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser"
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "io"]
# the standard library, without it deser only needs `alloc` (see the
# documentation of the crate)
std = ["deser-core/std"]
derive = ["deser-core/derive", "dep:deser-derive"]
# open enums: traits whose implementations (in any crate) are the variants
# of their trait objects (`#[deser::open_enum]` and `#[deser::variant]`)
open-enums = ["derive", "deser-core/open-enums", "deser-derive/open-enums"]
# reading and writing values from and to streams (`deser::io`)
io = ["std", "deser-core/io"]
# types of these crates serialize as well-known extension types
bigdecimal = ["deser-core/bigdecimal"]
chrono = ["deser-core/chrono"]
jiff = ["deser-core/jiff"]
num-bigint = ["deser-core/num-bigint"]
rust_decimal = ["deser-core/rust_decimal"]
time = ["deser-core/time"]
uuid = ["deser-core/uuid"]
# collections and byte buffers of these crates serialize like the standard
# containers
arrayvec = ["deser-core/arrayvec"]
bstr = ["deser-core/bstr"]
bytes = ["deser-core/bytes"]
hashbrown = ["deser-core/hashbrown"]
indexmap = ["deser-core/indexmap"]
smallvec = ["deser-core/smallvec"]

[dependencies]
# everything but the derive macros is in deser-core.  The formats depend on
# it directly so that they compile in parallel with the derive macros.
deser-core = { version = "0.9.1", path = "../deser-core", default-features = false }
deser-derive = { version = "0.9.1", path = "../deser-derive", optional = true }

[dev-dependencies]
# the tests use derive
deser = { path = ".", features = ["derive"] }
# the tests of the well-known types (with the features of the same name)
bigdecimal = { version = "0.4", default-features = false, features = ["std"] }
chrono = { version = "0.4.38", default-features = false }
jiff = { version = "0.2.14", default-features = false, features = ["std"] }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = { version = "1.33", default-features = false, features = ["std"] }
time = { version = "0.3.40", default-features = false, features = ["macros"] }
uuid = { version = "1", default-features = false }
# the tests of the collections and byte buffers of other crates
arrayvec = { version = "0.7", default-features = false }
bstr = { version = "1", default-features = false, features = ["alloc"] }
bytes = { version = "1.7", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
indexmap = { version = "2", default-features = false, features = ["std"] }
smallvec = { version = "1.6", default-features = false, features = ["const_generics"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
