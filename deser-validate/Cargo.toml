[package]
name = "deser-validate"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
description = "Validation for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "validation", "validator"]
categories = ["encoding"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-validate"
autotests = false

[dependencies]
deser-core = { version = "0.10.0", path = "../deser-core", default-features = false }
deser-location = { version = "0.10.0", path = "../deser-location" }
deser-path = { version = "0.10.0", path = "../deser-path" }

[dev-dependencies]
deser = { version = "0.10.0", path = "../deser", features = ["derive"] }
deser-json = { path = "../deser-json" }

[[test]]
name = "integration"
path = "tests/integration.rs"
